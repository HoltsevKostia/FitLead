name: FitLead CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0.x
  NODE_VERSION: 22
  CONFIGURATION: Release
  API_PROJECT: FitLead/FitLead.Api/FitLead.Api.csproj
  TEST_PROJECT: tests/FitLead.IntegrationTests/FitLead.IntegrationTests.csproj
  TEST_RESULTS_DIR: tests/TestResults
  IMAGE_NAME: fitlead-api

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: |
          dotnet restore "$API_PROJECT"
          dotnet restore "$TEST_PROJECT"

      - name: Build API
        run: dotnet build "$API_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Build integration tests
        run: dotnet build "$TEST_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test "$TEST_PROJECT" \
            --configuration "$CONFIGURATION" \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverage.runsettings \
            --results-directory "$TEST_RESULTS_DIR"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_DIR }}
          if-no-files-found: warn

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: FitLead/FitLead.Api/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Create Docker image metadata
        run: |
          mkdir -p artifacts/docker
          {
            echo "{"
            echo "  \"imageName\": \"${IMAGE_NAME}\","
            echo "  \"imageTag\": \"${GITHUB_SHA}\","
            echo "  \"dockerfile\": \"FitLead/FitLead.Api/Dockerfile\","
            echo "  \"buildContext\": \".\","
            echo "  \"commitSha\": \"${GITHUB_SHA}\","
            echo "  \"branch\": \"${GITHUB_REF_NAME}\","
            echo "  \"workflowRunId\": \"${GITHUB_RUN_ID}\","
            echo "  \"workflowRunNumber\": \"${GITHUB_RUN_NUMBER}\","
            echo "  \"createdAtUtc\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\""
            echo "}"
          } > artifacts/docker/docker-image-metadata.json

      - name: Upload Docker metadata
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-metadata
          path: artifacts/docker/docker-image-metadata.json
          if-no-files-found: error
