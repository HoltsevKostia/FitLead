name: FitLead CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: 8.0.x
  NODE_VERSION: 22
  CONFIGURATION: Release
  API_PROJECT: FitLead/FitLead.Api/FitLead.Api.csproj
  TEST_PROJECT: tests/FitLead.IntegrationTests/FitLead.IntegrationTests.csproj
  TEST_RESULTS_DIR: tests/TestResults

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: |
          dotnet restore "$API_PROJECT"
          dotnet restore "$TEST_PROJECT"

      - name: Build API
        run: dotnet build "$API_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Build integration tests
        run: dotnet build "$TEST_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test "$TEST_PROJECT" \
            --configuration "$CONFIGURATION" \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverage.runsettings \
            --results-directory "$TEST_RESULTS_DIR"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_DIR }}
          if-no-files-found: warn

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY: test-public-key

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate web build variables
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY is required to build the web image."
            exit 1
          fi

      - name: Prepare GHCR image names
        id: images
        shell: bash
        run: |
          owner_lowercase="${GITHUB_REPOSITORY_OWNER,,}"
          api_image="ghcr.io/${owner_lowercase}/fitlead-api"
          web_image="ghcr.io/${owner_lowercase}/fitlead-web"

          echo "api=${api_image}" >> "$GITHUB_OUTPUT"
          echo "web=${web_image}" >> "$GITHUB_OUTPUT"

          {
            echo "### Docker images"
            echo "- ${api_image}:latest"
            echo "- ${api_image}:${GITHUB_SHA}"
            echo "- ${web_image}:latest"
            echo "- ${web_image}:${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: FitLead/FitLead.Api/Dockerfile
          push: true
          cache-from: type=gha,scope=fitlead-api
          cache-to: type=gha,mode=max,scope=fitlead-api
          tags: |
            ${{ steps.images.outputs.api }}:latest
            ${{ steps.images.outputs.api }}:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile
          push: true
          cache-from: type=gha,scope=fitlead-web
          cache-to: type=gha,mode=max,scope=fitlead-web
          build-args: |
            NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY=${{ env.NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY }}
          tags: |
            ${{ steps.images.outputs.web }}:latest
            ${{ steps.images.outputs.web }}:${{ github.sha }}
