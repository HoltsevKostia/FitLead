name: FitLead CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  NODE_VERSION: 22
  CONFIGURATION: Release
  API_PROJECT: FitLead/FitLead.Api/FitLead.Api.csproj
  TEST_PROJECT: tests/FitLead.IntegrationTests/FitLead.IntegrationTests.csproj
  TEST_RESULTS_DIR: tests/TestResults

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: |
          dotnet restore "$API_PROJECT" --locked-mode
          dotnet restore "$TEST_PROJECT" --locked-mode

      - name: Build API
        run: dotnet build "$API_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Build integration tests
        run: dotnet build "$TEST_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test "$TEST_PROJECT" \
            --configuration "$CONFIGURATION" \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverage.runsettings \
            --results-directory "$TEST_RESULTS_DIR"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_DIR }}
          if-no-files-found: warn

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY: test-public-key

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  frontend-smoke:
    name: Frontend Smoke
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Smoke
      ASPNETCORE_URLS: http://127.0.0.1:5178
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=fitlead_smoke;Username=postgres;Password=postgres
      DemoSeed__Enabled: "false"
      SmokeSeed__Enabled: "true"
      ClientApp__BaseUrl: http://localhost:3000
      Cors__AllowedOrigins__0: http://localhost:3000
      Uploadcare__PublicKey: test-public-key
      Uploadcare__SecretKey: test-secret-key
      OutboxProcessor__Enabled: "false"
      Push__Enabled: "false"
      API_BASE_URL: http://127.0.0.1:5178
      FITLEAD_SMOKE_TEST: "true"
      NEXT_PUBLIC_SIGNALR_BASE_URL: http://localhost:5178
      NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY: test-public-key
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitlead_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fitlead_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore and build API
        run: |
          dotnet restore "$API_PROJECT" --locked-mode
          dotnet build "$API_PROJECT" \
            --configuration "$CONFIGURATION" \
            --no-restore

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Generate smoke JWT signing keys
        shell: bash
        run: |
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/smoke-private.pem"
          openssl rsa \
            -pubout \
            -in "$RUNNER_TEMP/smoke-private.pem" \
            -out "$RUNNER_TEMP/smoke-public.pem"

          {
            echo "Jwt__RsaPrivateKeyPem<<EOF"
            cat "$RUNNER_TEMP/smoke-private.pem"
            echo "EOF"
            echo "Jwt__RsaPublicKeyPem<<EOF"
            cat "$RUNNER_TEMP/smoke-public.pem"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Apply EF Core migrations
        run: |
          dotnet tool run dotnet-ef database update \
            --project FitLead/FitLead.Infrastructure/FitLead.Infrastructure.csproj \
            --startup-project "$API_PROJECT" \
            --connection "$ConnectionStrings__DefaultConnection" \
            --configuration "$CONFIGURATION" \
            --no-build

      - name: Start API
        shell: bash
        run: |
          nohup dotnet run \
            --project "$API_PROJECT" \
            --configuration "$CONFIGURATION" \
            --no-build \
            --no-restore \
            > "$RUNNER_TEMP/fitlead-api.log" 2>&1 &

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5178/health > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          cat "$RUNNER_TEMP/fitlead-api.log"
          exit 1

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Build frontend for smoke tests
        working-directory: client
        run: npm run build

      - name: Run frontend smoke tests
        working-directory: client
        run: npx playwright test --workers=1

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-diagnostics
          path: |
            client/playwright-report
            client/test-results
            ${{ runner.temp }}/fitlead-api.log
          if-no-files-found: warn
          retention-days: 7

  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - backend-ci
      - frontend-ci
      - frontend-smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate web build variables
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY is required to build the web image."
            exit 1
          fi

      - name: Prepare GHCR image names
        id: images
        shell: bash
        run: |
          owner_lowercase="${GITHUB_REPOSITORY_OWNER,,}"
          api_image="ghcr.io/${owner_lowercase}/fitlead-api"
          web_image="ghcr.io/${owner_lowercase}/fitlead-web"

          echo "api=${api_image}" >> "$GITHUB_OUTPUT"
          echo "web=${web_image}" >> "$GITHUB_OUTPUT"

          {
            echo "### Docker images"
            echo "- ${api_image}:latest"
            echo "- ${api_image}:${GITHUB_SHA}"
            echo "- ${web_image}:latest"
            echo "- ${web_image}:${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: FitLead/FitLead.Api/Dockerfile
          push: true
          cache-from: type=gha,scope=fitlead-api
          cache-to: type=gha,mode=max,scope=fitlead-api
          tags: |
            ${{ steps.images.outputs.api }}:latest
            ${{ steps.images.outputs.api }}:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile
          push: true
          cache-from: type=gha,scope=fitlead-web
          cache-to: type=gha,mode=max,scope=fitlead-web
          build-args: |
            NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY=${{ env.NEXT_PUBLIC_UPLOADCARE_PUBLIC_KEY }}
          tags: |
            ${{ steps.images.outputs.web }}:latest
            ${{ steps.images.outputs.web }}:${{ github.sha }}
